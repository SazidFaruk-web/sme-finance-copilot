[project]
name = "sme-finance-copilot"
version = "0.1.0"
description = "AI finance assistant for Bangladesh SMEs (FinTechathon 2026, Topic E)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = ["slow: needs the real local model (run: pytest -m slow)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["sme_copilot"]
omit = ["sme_copilot/cli.py", "sme_copilot/demo/evidence.py"]
