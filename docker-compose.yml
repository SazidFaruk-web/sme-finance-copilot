# One-command demo:            docker compose up --build
# Fully local LLM (no cloud):  docker compose --profile local-llm up --build
#                              then pick "Local Qwen2.5 7B (Ollama)" in the model dropdown,
#                              or set LLM_PROFILE=local-qwen7b and LOCAL_ONLY_MODE=true in .env
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-demo}
      LLM_PROFILE: ${LLM_PROFILE:-rules-offline}
      LLM_SHARED_ONLY: ${LLM_SHARED_ONLY:-false}
      SHARED_LLM_BASE_URL: ${DOCKER_SHARED_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      SHARED_LLM_MODEL: ${SHARED_LLM_MODEL:-sme-copilot}
      LOCAL_ONLY_MODE: ${LOCAL_ONLY_MODE:-false}
      MASK_PII: ${MASK_PII:-true}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
    # Reset + seed the demo persona, then serve. Use `serve` instead to keep data between restarts.
    command: ["python", "-m", "sme_copilot.cli", "demo", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    restart: "no"

volumes:
  appdata:
  ollama:
