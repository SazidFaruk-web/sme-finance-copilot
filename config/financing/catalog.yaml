# Financing options catalog for Bangladesh SMEs.
#
# !!! ALL FIGURES BELOW ARE ILLUSTRATIVE PLACEHOLDERS !!!
# They describe typical *product types* available to Bangladesh SMEs, not any specific lender's
# offer. Amounts, rates, tenures, fees and eligibility rules MUST be replaced with verified data
# from the lender's official product page or the relevant Bangladesh Bank circular before real
# use. The UI shows "Illustrative - verify with lender" on every item where verified: false.
#
# source_url: placeholder pointing to the regulator / industry homepage where the real terms
#             should be looked up; replace with the exact product page or circular.
# Eligibility rules are evaluated against the user's analysed numbers by financing_catalog/matcher.py.

products:
  - id: bank_sme_term_loan
    name: "Bank SME term loan"
    lender_type: commercial_bank
    product_type: term_loan
    purposes: [equipment, expansion, working_capital]
    min_amount: 300000
    max_amount: 5000000
    interest_rate_min_pct: 11.0
    interest_rate_max_pct: 14.0
    rate_method: reducing
    fees_pct: 1.0
    tenure_months_min: 12
    tenure_months_max: 60
    collateral: "Usually property, FDR or other security above a threshold, plus personal guarantee"
    collateral_required: true
    collateral_coverage_min: 0.5
    speed_days: 30
    documents_required: [trade_license, etin, nid, bank_statement_12m, financial_statements, photos, guarantor_nid, collateral_papers]
    eligibility:
      min_business_age_months: 24
      min_avg_monthly_revenue: 200000
      max_revenue_cv: 0.6
      min_dscr: 1.25
      min_months_of_records: 12
      requires_trade_license: true
      requires_tin: true
      requires_bank_account: true
    source_url: "https://www.bb.org.bd/"
    last_verified_date: null
    verified: false
    illustrative: true

