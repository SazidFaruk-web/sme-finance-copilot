  invoices: {label: "Open invoices to buyers", generated: true}
  buyer_purchase_orders: {label: "Buyer purchase orders / work orders", generated: false}
  training_certificate: {label: "Entrepreneurship training certificate", generated: false}
  active_wallet_history: {label: "Active mobile-wallet transaction history", generated: false}
  purchase_history: {label: "Purchase history with the supplier", generated: true}
