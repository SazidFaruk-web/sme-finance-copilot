  photos: {label: "Passport-size photos", business_flag: null}
  guarantor_nid: {label: "Guarantor's NID", business_flag: null}
  bank_statement_6m: {label: "Bank statement (last 6 months)", business_flag: has_bank_account}
  bank_statement_12m: {label: "Bank statement (last 12 months)", business_flag: has_bank_account}
  financial_statements: {label: "Financial statements / income-expense summary", generated: true}
  business_plan: {label: "Short business plan", generated: false}
  stock_report: {label: "Stock (inventory) report", generated: false}
  collateral_papers: {label: "Collateral documents (deed / FDR)", business_flag: null}
