# LLM provider profiles.
#
# The AI Assistant uses one model: Claude Sonnet 5.5 through the Anthropic API.
# Set ANTHROPIC_API_KEY in .env (never put keys here). LOCAL_ONLY_MODE must be false, because
# prompts go to Anthropic's servers; phone and account numbers are masked first (MASK_PII).
#
# adapter:    anthropic | openai | gemini | openai_compatible | ollama | rules
# external:   true if prompts leave this machine.
# api_key_env: NAME of the environment variable holding the key.
# pricing:    USD per million tokens, for benchmark cost estimates; verify against the vendor's price page.
# vision:     true if the model reads photos (khata photo import).

default_profile: claude-sonnet

profiles:
  claude-sonnet:
    adapter: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    external: true
    vision: true
    label: "Claude Sonnet 5.5"
    pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}

  # Not a model and not shown in the model picker: deterministic rules that answer only when the
  # Claude API is unreachable (no key, no internet), so the assistant never goes silent.
  rules-offline:
    adapter: rules
    model: rules-v1
    external: false
    label: "Offline rules engine (no model, deterministic)"

routing:
  enabled: false
  fallback_chain: [claude-sonnet, rules-offline]
