# Indicative price ranges for things a small business in Bangladesh commonly saves up for.
#
# These are NOT quotes. They exist so a roadmap can be drafted when the owner does not yet know a
# price, and every one of them is shown to the owner as a range to confirm or replace before the
# plan is saved. Ranges were read from publicly advertised retail listings in Bangladesh and are
# deliberately wide; a real quote from a supplier always replaces them.
#
# reviewed: the date a human last checked the range. Stale entries are still shown, with their date.
# match:    case-insensitive regular expression against the owner's item wording (English or Bangla).
# low/high: taka. The midpoint is used as the planning figure.

reviewed: 2026-10-20
currency: BDT
note:
  en: Typical advertised range in Bangladesh, not a quote. Ask a supplier for a written price.
  bn: বাংলাদেশে সাধারণত বিজ্ঞাপিত দামের সীমা, কোনো প্রস্তাব নয়। সরবরাহকারীর কাছ থেকে লিখিত দাম নিন।
  zh: 孟加拉国常见的广告价格区间，不是报价。请向供应商索取书面价格。

items:
  - id: oven_commercial
    match: "(commercial|bakery|deck|industrial|big|large|gas|convection).{0,20}(oven|ওভেন)|(oven|ওভেন).{0,20}(commercial|bakery|deck|industrial|big|large)"
    label: {en: Commercial or bakery oven, bn: বাণিজ্যিক বা বেকারি ওভেন, zh: 商用或烘焙烤箱}
    low: 120000
    high: 400000

  - id: oven_small
    match: "oven|ওভেন|মাইক্রোওয়েভ|microwave"
    label: {en: Household or small oven, bn: ঘরোয়া বা ছোট ওভেন, zh: 家用或小型烤箱}
    low: 12000
    high: 45000

  - id: grill_machine
    match: "grill|গ্রিল|rotisserie|shawarma|শর্মা|barbecue|bbq"
    label: {en: Chicken grill or rotisserie machine, bn: মুরগি গ্রিল বা রোটিসারি যন্ত্র, zh: 烤鸡或旋转烤肉机}
    low: 18000
    high: 95000

  - id: deep_freezer
    match: "deep freez|ডিপ ফ্রিজ|chest freez|freezer|ফ্রিজার"
