sources:
  - id: trade
    title: {en: Dhaka South trade licence, bn: ঢাকা দক্ষিণ ট্রেড লাইসেন্স}
    authority: Dhaka South City Corporation
    url: https://dscc.gov.bd/pages/static-pages/6922dba2933eb65569e0b707
    audience: dscc
    kind: compliance
    documents: {en: 'Existing licence, identity and address evidence, rent documents, relevant payment receipts. Confirm the exact list with the revenue office.', bn: 'আগের লাইসেন্স, পরিচয় ও ঠিকানার প্রমাণ, ভাড়ার কাগজ, প্রযোজ্য রশিদ। রাজস্ব দপ্তরে সঠিক তালিকা যাচাই করুন।'}
    destination: {en: 'DSCC revenue office for your ward; use the official procedure page to find the application route.', bn: 'আপনার ওয়ার্ডের ডিএসসিসি রাজস্ব দপ্তর; আবেদনের পথ জানতে সরকারি নির্দেশনা দেখুন।'}
  - id: income_tax
    title: {en: NBR income tax return, bn: এনবিআর আয়কর রিটার্ন}
    authority: National Board of Revenue
    url: https://nbr.gov.bd/uploads/news-scroller/FAQ_e-Return_-_2026.pdf
    audience: bangladesh
    kind: compliance
    documents: {en: 'TIN, prior return, income and expense records, household spending, assets, debts and tax-payment evidence. Business records alone may be incomplete.', bn: 'টিআইএন, আগের রিটার্ন, আয়-ব্যয়, সংসার খরচ, সম্পদ, ঋণ ও কর প্রদানের প্রমাণ। শুধু ব্যবসার হিসাব যথেষ্ট নাও হতে পারে।'}
    destination: {en: 'NBR e-Return at etaxnbr.gov.bd. Some steps need a desktop or laptop. Keep the acknowledgement after filing.', bn: 'etaxnbr.gov.bd-তে এনবিআর ই-রিটার্ন। কিছু ধাপে কম্পিউটার লাগতে পারে। দাখিলের প্রাপ্তিস্বীকার সংরক্ষণ করুন।'}
  - id: vat
    title: {en: VAT registration and filing, bn: ভ্যাট নিবন্ধন ও দাখিল}
    authority: National Board of Revenue
    url: https://nbr.gov.bd/
    audience: bangladesh
    kind: compliance
    documents: {en: 'Current BIN if any, business activity, sales totals, purchase invoices and previous filings. Registration, filing and payment need separate checks.', bn: 'বিআইএন থাকলে সেটি, ব্যবসার ধরন, মোট বিক্রি, কেনার চালান ও আগের দাখিল। নিবন্ধন, দাখিল ও পেমেন্ট আলাদা করে যাচাই করতে হবে।'}
    destination: {en: 'Your NBR VAT office. Confirm applicability, current form and deadline before filing.', bn: 'আপনার এনবিআর ভ্যাট দপ্তর। দাখিলের আগে প্রযোজ্যতা, বর্তমান ফরম ও শেষ তারিখ যাচাই করুন।'}
